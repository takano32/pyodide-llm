# /benchmark/ (T134) in every browser the runners offer (tests/bench-check.mjs): every section once, the Markdown of
# each browser in the summary. It took the place of gpu.yml (T94) and opfs.yml (T137). The runners have no GPU and are
# not the owner's devices: this shows that the page works everywhere (the shaders agree with JavaScript on a software
# adapter, every piece of the file reads back right, the forward pass gives finite numbers); the speeds that count are
# the owner's. Playwright's Firefox runs under a debugger (AGENTS.md): its numbers are not Firefox's. By hand only.
name: Benchmark

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        required: false
      model:
        description: The site's model the model section loads
        default: 'tiny-lm'
      size:
        description: MiB the storage section writes
        default: '256'
      os:
        description: 'T242: one runner only (ubuntu-latest, macos-latest or windows-latest); all three when left out'
        default: 'all'
      browsers:
        description: 'T242: the browsers, e.g. "webkit"; all five when left out'
        default: 'chromium firefox webkit chrome msedge'
      run:
        description: 'T242: the page''s ?run= (e.g. model, or cpu,model)'
        default: 'all'
      times:
        description: 'T242: how many times over, each a fresh browser (a failure that comes now and then)'
        default: '1'
      build:
        description: 'T242: a commit or branch to build (with tiny-lm alone) and serve from the runner in place of the site: a version before it goes out, or an old one'
        default: ''

jobs:
  # T242: the site of inputs.build, built once on Linux (the kernels and tiny-lm alone) and handed to every runner
  site:
    if: ${{ inputs.build != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build the site with tiny-lm alone
        shell: bash
        run: |
          npm ci
          python3 -m pip install --quiet numpy sentencepiece
          make kernels tiny-lm.bin tiny-lm.tokenizer.bin
          mkdir -p public/models
          split -b 8388608 -d -a 3 tiny-lm.bin public/models/tiny-lm.bin.
          cp tiny-lm.tokenizer.bin public/models/
          npm run build
          echo "built $(git log -1 --format='%h %s')"

      - name: Hand it on
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 1

  bench:
    name: ${{ matrix.os }}
    needs: site
    if: ${{ always() && (needs.site.result == 'success' || needs.site.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os && inputs.os != 'all') && format('["{0}"]', inputs.os) || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools and the browsers
        shell: bash
        run: |
          npm ci
          npx playwright-core install --with-deps chromium firefox webkit

      - name: Take the built site
        if: ${{ inputs.build != '' }}
        uses: actions/download-artifact@v7
        with:
          name: site
          path: dist/

      - name: Run all
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          BROWSERS: ${{ inputs.browsers || 'chromium firefox webkit chrome msedge' }}
          MODEL: ${{ inputs.model || 'tiny-lm' }}
          SIZE: ${{ inputs.size || '256' }}
          SECTIONS: ${{ inputs.run || 'all' }}
          TIMES: ${{ inputs.times || '1' }}
          BUILD: ${{ inputs.build }}
        run: |
          set -o pipefail
          echo "## ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BUILD" ]; then where=(--dist); else where=("$SITE"); fi
          failed=0
          for try in $(seq 1 "$TIMES"); do
            echo "=== try $try of $TIMES"
            node tests/bench-check.mjs "${where[@]}" $BROWSERS --model "$MODEL" --size "$SIZE" --run "$SECTIONS" | tee -a "$GITHUB_STEP_SUMMARY" || { failed=$((failed + 1)); echo "=== try $try FAILED"; }
          done
          echo "=== $failed of $TIMES tries failed"
          [ "$failed" = 0 ]

name: Tests

# T.188: the tests the deploy runs, and more, on any branch (--ref), without deploying: the development machine (an ARM
# box of 2 cores, shared) runs none of them any more (the owner, 2026-09-27: "いったん、テスト CI だけにしねぇか？").
# `extra` runs more commands after them, for a branch's own measurements (the same process takes the old and the new,
# as AGENTS.md says).
#
# T.193 (the owner, 2026-09-27: "たまーにフルテストする感じでコミットたくさんあるときは軽くしたい"): by default the light
# suite, the very steps the deploy runs (tests/suite.sh light: pytest, the page's modules, smoke; then the build).
# full=true, and the nightly schedule on main, run the full one (tests/suite.sh full: and forward-check shared, --plain
# and --wide, gpu-default-check, threads-check). An empty full= is the default, light (a dispatch fills an empty input
# with its default: T.192).
#
#   node tests/ci.mjs run tests.yml [full=true] [extra="node tests/profile.mjs"] [runner=ubuntu-24.04-arm] --ref <branch>
#
# T.238: only_extra=true runs the `extra` commands alone (no models, no suite, no build: a job that needs none of them,
# like tests/reference_27b.sh, which builds another program and fetches a model of its own), and minutes= is the job's
# time limit (90 where it says nothing).
# T.233: what the extra commands leave in .tmp/keep is kept with the run (an artifact, a week).
on:
  schedule:
    # every night at 03:17 in Japan (18:17 UTC; off the hour, when GitHub's schedules crowd), the full suite on main
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'T.193: the full suite (forward-check, gpu-default-check, threads-check too), not only the light one the deploy runs'
        type: boolean
        required: false
        default: false
      extra:
        description: 'more shell commands to run after the tests (optional), e.g. node tests/profile.mjs --from 4000'
        required: false
        default: ''
      runner:
        description: 'the runner (optional), e.g. ubuntu-24.04-arm for arm64 (T.166: a kernel measured where it matters)'
        required: false
        default: 'ubuntu-latest'
      only_extra:
        description: 'T.238: run the extra commands alone: no models, no suite, no build'
        type: boolean
        required: false
        default: false
      updated:
        description: 'T.441: also run tests/updated-in-browser.mjs in the three engines, as the nightly run does'
        type: boolean
        required: false
        default: false
      minutes:
        description: 'T.238: the time limit of the job in minutes (optional, 90)'
        required: false
        default: '90'

permissions:
  contents: read
  # T.233: the extra commands may fetch what an earlier run kept (gh run download)
  actions: read

jobs:
  tests:
    name: tests (${{ (github.event_name == 'schedule' || inputs.full == true || inputs.full == 'true') && 'full' || 'light' }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON(inputs.minutes || '90') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        if: ${{ !(inputs.only_extra == true || inputs.only_extra == 'true') }}
        run: |
          pip install numpy pytest tokenizers regex sentencepiece jinja2
          npm ci
          make models kernels

      - name: Tests (tests/suite.sh)
        if: ${{ !(inputs.only_extra == true || inputs.only_extra == 'true') }}
        env:
          SUITE: ${{ (github.event_name == 'schedule' || inputs.full == true || inputs.full == 'true') && 'full' || 'light' }}
          WHY: ${{ github.event_name }}
        run: |
          echo "suite: $SUITE, by $WHY, $(node -p 'require("os").cpus()[0].model')"
          bash tests/suite.sh "$SUITE"

      - name: Build the site
        if: ${{ !(inputs.only_extra == true || inputs.only_extra == 'true') }}
        # (and what was built, as the deploy holds it: tests/dist-check.mjs)
        run: |
          npm run build
          node tests/dist-check.mjs

      # T.441: a page left open across a deployment (tests/updated-in-browser.mjs: 39 cases, the model page's and
      # /benchmark/'s), in the three engines, on the site just built: nightly, as nothing else runs it on a schedule
      - name: Install the browsers (nightly)
        if: ${{ (github.event_name == 'schedule' || inputs.updated == true || inputs.updated == 'true') && !(inputs.only_extra == true || inputs.only_extra == 'true') }}
        timeout-minutes: 20
        run: |
          bash tests/apt-timeouts.sh
          npx playwright-core install --with-deps chromium firefox webkit

      - name: A page left open across a deployment (nightly)
        if: ${{ (github.event_name == 'schedule' || inputs.updated == true || inputs.updated == 'true') && !(inputs.only_extra == true || inputs.only_extra == 'true') }}
        timeout-minutes: 45
        run: |
          failed=0
          for engine in chromium firefox webkit; do node tests/updated-in-browser.mjs "$engine" || failed=1; done
          exit "$failed"

      - name: More
        if: ${{ inputs.extra != '' }}
        env:
          EXTRA: ${{ inputs.extra }}
          GH_TOKEN: ${{ github.token }}
        run: bash -c "$EXTRA"

      # T.233: what the extra commands put in .tmp/keep stays with the run for a week (tests/page_27b.sh: the references
      # of the 27B, 50 minutes of a runner, which a later run takes with REFERENCES=<this run's id>)
      - name: Keep what the extra commands left in .tmp/keep
        if: ${{ always() && inputs.extra != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: kept
          path: .tmp/keep/
          if-no-files-found: ignore
          retention-days: 7

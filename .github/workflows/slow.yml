# T118: the page on a slow line and on one that stops (tests/slow-check.mjs, a throttling proxy of its own), in
# Chromium, against the deployed site. By hand only.
name: Slow line

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'slow (the whole line at rate) or stall (jsDelivr stops after 200 kB)'
        default: 'slow'
      rate:
        description: 'bytes a second for the whole line (50000 = 0.4 Mbps)'
        default: '50000'
      model:
        description: 'the model the page is opened with (stories260K: 1 MB; stories3_5M: 15 MB; tiny-lm: 33 MB)'
        default: 'stories260K'
      queue:
        description: 'how the line is shared: lane (the oldest connection first, T118), fair, or fifo (one queue: a deep buffer)'
        default: 'lane'
      buffer:
        description: 'fifo: the queue in bytes'
        default: '262144'
      url:
        description: 'the site to test (default: the deployed one)'
        required: false

jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      # the inputs go in by the environment, not into the script's text (AGENTS.md: gguf.yml's lesson)
      - name: Run
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          SCENARIO: ${{ inputs.scenario }}
          RATE: ${{ inputs.rate }}
          MODEL: ${{ inputs.model }}
          QUEUE: ${{ inputs.queue }}
          BUFFER: ${{ inputs.buffer }}
        run: node tests/slow-check.mjs "$SCENARIO" "$SITE" --rate "$RATE" --model "$MODEL" --queue "$QUEUE" --buffer "$BUFFER" | tee -a "$GITHUB_STEP_SUMMARY"

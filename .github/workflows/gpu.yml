# T94, stage 0: public/gpu-test/ in every browser the runners offer (tests/gpu-check.mjs). The runners have no GPU:
# this checks that the page and its shaders work, on a software adapter where a browser has one; the speed is
# measured on the owner's devices. The Markdown each browser measured goes to the summary. By hand only.
name: WebGPU check

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site to check
        required: false

jobs:
  gpu:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, browsers: chromium firefox webkit chrome msedge }
          - { os: macos-latest, browsers: chromium firefox webkit chrome msedge }
          - { os: windows-latest, browsers: chromium firefox webkit chrome msedge }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools and the browsers
        shell: bash
        run: |
          npm ci
          npx playwright-core install --with-deps chromium firefox webkit

      - name: Check
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
        run: |
          echo "## ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          node tests/gpu-check.mjs "$SITE" ${{ matrix.browsers }} | tee -a "$GITHUB_STEP_SUMMARY"

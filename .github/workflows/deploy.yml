name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex
          npm ci
          make models kernels

      - name: Unit tests of the engine
        run: python -m pytest tests -q

      # Node alone: the benchmark's table (T45) and the table CI writes (T82)
      - name: Unit tests of the page's modules
        run: |
          node tests/bench.mjs
          node tests/summary-check.mjs

      - name: Smoke test with the latest Pyodide
        run: |
          # the page resolves the latest Pyodide release when it is opened, so test against that one
          npm install --no-save pyodide@latest
          node tests/smoke.mjs

      - name: Build the site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

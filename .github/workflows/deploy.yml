name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # the ledger and the notes are not on the site: a push of nothing else does not deploy (the owner, 2026-10-10)
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a deploy is not cancelled halfway (Pages); GitHub folds the queue to the newest waiting one (T193)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # T262: a deploy is 3 to 4 minutes; without a limit of its own a stuck step held the queue for GitHub's 360
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex sentencepiece
          npm ci
          make models kernels

      # T193: the light suite only (what keeps a broken page off the site: pytest, the page's modules, smoke). The heavier
      # checks run in tests.yml, every night (its schedule) and on a branch with full=true: a commit on main that this
      # suite cannot tell apart is checked by the next full suite.
      # T384: a test of this suite takes seconds (the longest about half a minute), and the job has 30 minutes: with the
      # suite's own limit of 30 minutes a test that stood still was cut by the job before tests/limited.mjs could say
      # where it stood (run 38055812702, the second time after worker-fetches-check's last line).
      - name: Tests (the light suite)
        env:
          TEST_LIMIT: 300
        run: |
          echo "suite: light, by ${{ github.event_name }}"
          bash tests/suite.sh light

      - name: Build the site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

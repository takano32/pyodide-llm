name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # the ledger and the notes are not on the site: a push of nothing else does not deploy (the owner, 2026-10-10)
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # T652: the job "again" starts this workflow once more
  actions: write

# a deploy is not cancelled halfway (Pages); GitHub folds the queue to the newest waiting one (T193)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      pages: ${{ steps.deployment.outcome }}
    runs-on: ubuntu-latest
    # T262: a deploy is 3 to 4 minutes; without a limit of its own a stuck step held the queue for GitHub's 360
    # T652: the build and the tests take up to 15 minutes, and Pages' step up to the action's 10
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex sentencepiece jinja2
          npm ci
          make models kernels

      # T193: the light suite only (what keeps a broken page off the site: pytest, the page's modules, smoke). The heavier
      # checks run in tests.yml, every night (its schedule) and on a branch with full=true: a commit on main that this
      # suite cannot tell apart is checked by the next full suite.
      # T384: a test of this suite takes seconds (the longest about half a minute), and the job has 30 minutes: with the
      # suite's own limit of 30 minutes a test that stood still was cut by the job before tests/limited.ts could say
      # where it stood (run 38055812702, the second time after worker-fetches-check's last line).
      - name: Tests (the light suite)
        env:
          TEST_LIMIT: 300
        run: |
          echo "suite: light, by ${{ github.event_name }}"
          bash tests/suite.sh light

      - name: Build the site
        # (T367.3.1, dist-check: what was built, held to the names the Service Worker takes apart: a file it would
        # never drop the old copy of, or two that would put each other's copy out, is not deployed)
        run: |
          npm run build
          node tests/dist-check.ts

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      # T652: Pages sat in "syncing_files" or "updating_pages" past the action's 10 minutes 5 times in 11 deploys on
      # 2026-11-06 (the site is about 1 GB). The action caps its own timeout at 10 minutes and cancels the deployment
      # as it gives up, so a second try in the same run finds it cancelled, and a rerun of the job finds two
      # artifacts: the job "again" starts a new run instead, which went through each time it was tried
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  again:
    needs: deploy
    # once, and only for Pages' step: a push's deploy whose Pages step failed starts a new run by dispatch, and
    # that run does not start another (a failure of the tests or the build is not tried again)
    if: failure() && github.event_name == 'push' && needs.deploy.outputs.pages == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the deploy once more
        env:
          GH_TOKEN: ${{ github.token }}
        # (GitHub's API answered 500 to it once, 2026-11-07: three tries a minute apart)
        run: |
          for try in 1 2 3; do
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && exit 0
            sleep 60
          done
          exit 1
